<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#2d8a9f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mouries Music">
    <meta name="application-name" content="Mouries Music">
    <meta name="msapplication-TileColor" content="#2d8a9f">
    <meta name="format-detection" content="telephone=no">
    <meta name="color-scheme" content="dark light">
    <title>Mouries' Music 🎵</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E🎵%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%232d8a9f' width='100' height='100' rx='20'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E🎻%3C/text%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <script>
        (function() {
            try {
                const storageKey = 'theme-preference';
                const autoKey = 'theme-auto';
                const saved = localStorage.getItem(storageKey);
                const isAuto = localStorage.getItem(autoKey) !== 'false';
                let theme = 'light';

                if (saved && !isAuto) {
                    theme = saved;
                } else {
                    const hour = new Date().getHours();
                    const isDarkTime = hour >= 19 || hour < 7;
                    theme = isDarkTime ? 'dark' : 'light';
                }

                document.documentElement.setAttribute('data-theme', theme);
            } catch (err) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <!-- Tone.js libraries for MIDI playback -->
    <script src="https://unpkg.com/tone"></script>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <!-- Tune detail view support -->
    <script src="tune-detail-view.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Dark Mode Toggle -->
    <div class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
        <span class="theme-toggle-btn" id="theme-toggle-btn">🌙</span>
        <span class="theme-toggle-label" id="theme-toggle-label">Dark</span>
        <span class="theme-toggle-auto" id="theme-auto-indicator"></span>
    </div>

    <div class="container">
        <h1>Mouries' Music 🎵</h1>

        <div class="stats">
            <div class="stat-item">
                <span class="stat-number" id="total-count">0</span>
                <span>Total Tunes</span>
                <small id="versions-summary" style="display:none; color: #888; font-size: 0.75rem;"></small>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="category-count">0</span>
                <span>Categories</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="composer-count">0</span>
                <span>Composers</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="country-count">0</span>
                <span>Countries</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="svg-count">0</span>
                <span>PDFs Available</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="midi-count">0</span>
                <span>MIDI Files</span>
            </div>
        </div>

        <div class="filters">
            <input type="search" id="search" placeholder="🔍 Search by title, composer, key, or tag..." onkeyup="filterItems()">

            <select id="category-filter" onchange="filterItems()">
                <option value="">All Categories</option>
            </select>

            <select id="country-filter" onchange="filterItems()">
                <option value="">All Countries</option>
            </select>

            <select id="composer-filter" onchange="filterItems()">
                <option value="">All Composers</option>
            </select>

            <select id="difficulty-filter" onchange="filterItems()">
                <option value="">All Difficulties</option>
                <option value="1">⭐ Beginner</option>
                <option value="2">⭐⭐ Easy</option>
                <option value="3">⭐⭐⭐ Intermediate</option>
                <option value="4">⭐⭐⭐⭐ Advanced</option>
                <option value="5">⭐⭐⭐⭐⭐ Expert</option>
            </select>

            <select id="tag-filter" onchange="filterItems()">
                <option value="">All Tags</option>
            </select>

            <select id="genre-filter" onchange="filterItems()">
                <option value="">All Genres</option>
            </select>

            <select id="subgenre-filter" onchange="filterItems()">
                <option value="">All Subgenres</option>
            </select>

            <select id="mood-filter" onchange="filterItems()">
                <option value="">All Moods</option>
            </select>

            <div class="view-toggle">
                <button id="table-view" class="active" onclick="switchView('table')">📋 Table</button>
                <button id="card-view" onclick="switchView('cards')">🎴 Cards</button>
            </div>

            <div class="quick-filters">
                <button class="quick-filter-btn" onclick="showTop10()">⭐ Top 10</button>
                <button class="quick-filter-btn" onclick="showChristmas()">🎄 Christmas</button>
                <button class="quick-filter-btn" onclick="showWedding()">💍 Wedding</button>
                <button class="quick-filter-btn" onclick="clearQuickFilters()">🔄 Show All</button>
            </div>
        </div>

        <div id="no-results" style="display: none; text-align: center; padding: 2rem; color: #666;">
            No tunes match your filters. Try adjusting your search criteria.
        </div>

        <div id="table-container">
            <table id="music-table">
                <thead>
                    <tr>
                        <th onclick="sortTable(0)">Title</th>
                        <th onclick="sortTable(1)">Composer</th>
                        <th onclick="sortTable(2)">Country</th>
                        <th onclick="sortTable(3)">Genre</th>
                        <th onclick="sortTable(4)">Key</th>
                        <th onclick="sortTable(5)">Range</th>
                        <th onclick="sortTable(6)">Difficulty</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dynamically populated from tunes-catalog.json -->
                </tbody>
            </table>
        </div>

        <div id="cards-container" class="cards-grid" style="display: none;">
            <!-- Dynamically populated from tunes-catalog.json -->
        </div>
    </div>

    <!-- MIDI Controls -->
    <div id="midi-controls" class="midi-controls">
        <div class="midi-controls-inner">
            <div class="midi-now-playing">
                <span id="midi-title">🎵 Now Playing</span>
            </div>
            <div class="midi-controls-buttons">
                <button class="midi-stop-btn" onclick="stopMidi()">⏹ Stop</button>
                <button class="midi-close-btn" onclick="closeMidiControls()">✕ Close</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="lightbox-modal">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <img id="lightbox-image" class="lightbox-image" src="" alt="">
        <div id="lightbox-title" class="lightbox-title"></div>
    </div>

    <script>
        // ============================================
        // Global State
        // ============================================
        let allTunes = [];
        let filteredTunes = [];
        let currentView = 'table';
        let currentSortColumn = 0;
        let sortAscending = true;

        // ============================================
        // Dark Mode Management
        // ============================================
        const themeManager = {
            STORAGE_KEY: 'theme-preference',
            AUTO_KEY: 'theme-auto',

            init() {
                const savedTheme = localStorage.getItem(this.STORAGE_KEY);
                const isAuto = localStorage.getItem(this.AUTO_KEY) !== 'false';

                if (savedTheme && !isAuto) {
                    this.setTheme(savedTheme, false);
                } else {
                    this.autoDetectTheme();
                }

                this.updateToggleUI();
            },

            autoDetectTheme() {
                const hour = new Date().getHours();
                const isDarkTime = hour >= 19 || hour < 7;
                this.setTheme(isDarkTime ? 'dark' : 'light', true);
            },

            setTheme(theme, isAuto = false) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem(this.STORAGE_KEY, theme);
                localStorage.setItem(this.AUTO_KEY, isAuto ? 'true' : 'false');
                this.updateToggleUI();
            },

            toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                this.setTheme(newTheme, false);
            },

            updateToggleUI() {
                const btn = document.getElementById('theme-toggle-btn');
                const label = document.getElementById('theme-toggle-label');
                const autoIndicator = document.getElementById('theme-auto-indicator');
                const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
                const isAuto = localStorage.getItem(this.AUTO_KEY) !== 'false';

                if (btn) btn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
                if (label) label.textContent = currentTheme === 'dark' ? 'Light' : 'Dark';
                if (autoIndicator) autoIndicator.textContent = isAuto ? '(auto)' : '';
            },

            enableAuto() {
                localStorage.setItem(this.AUTO_KEY, 'true');
                this.autoDetectTheme();
            }
        };

        function toggleTheme() {
            themeManager.toggleTheme();
        }

        // Initialize theme on page load
        themeManager.init();

        // Re-check theme every minute for auto mode
        setInterval(() => {
            if (localStorage.getItem(themeManager.AUTO_KEY) !== 'false') {
                themeManager.autoDetectTheme();
            }
        }, 60000);

        // ============================================
        // Catalog Loading
        // ============================================
        document.addEventListener('DOMContentLoaded', loadCatalog);

        async function loadCatalog() {
            try {
                const response = await fetch('tunes-catalog.json');
                if (!response.ok) throw new Error('Failed to load catalog');

                const catalog = await response.json();
                allTunes = catalog.tunes || [];
                filteredTunes = [...allTunes];

                populateFilters();
                updateStats();
                renderTunes();
                restoreFilterState();
                checkMobileView();
                checkUrlForTune();

            } catch (err) {
                console.error('Error loading catalog:', err);
                document.getElementById('table-body').innerHTML =
                    `<tr><td colspan="7" style="text-align: center; color: #c00; padding: 2rem;">
                        Error loading tunes catalog: ${err.message}<br>
                        <small>Make sure tunes-catalog.json exists.</small>
                    </td></tr>`;
            }
        }

        // ============================================
        // Filter Population
        // ============================================
        function populateFilters() {
            // Categories
            const categories = [...new Set(allTunes.map(t => t.category).filter(Boolean))].sort();
            populateSelect('category-filter', categories);

            // Countries with flags and counts
            const countryCounts = allTunes.reduce((acc, t) => {
                if (t.country) acc[t.country] = (acc[t.country] || 0) + 1;
                return acc;
            }, {});
            const countriesWithFlags = [...new Set(allTunes.map(t => t.country).filter(Boolean))]
                .sort()
                .map(country => {
                    const flag = allTunes.find(t => t.country === country)?.country_flag || '🌍';
                    return { value: country, label: `${flag} ${country} (${countryCounts[country]})` };
                });
            populateSelectWithLabels('country-filter', countriesWithFlags);

            // Composers with counts
            const composerCounts = allTunes.reduce((acc, t) => {
                if (t.composer) acc[t.composer] = (acc[t.composer] || 0) + 1;
                return acc;
            }, {});
            const composersWithCounts = [...new Set(allTunes.map(t => t.composer).filter(Boolean))]
                .sort()
                .map(composer => ({ value: composer, label: `${composer} (${composerCounts[composer]})` }));
            populateSelectWithLabels('composer-filter', composersWithCounts);

            // Tags
            const tags = [...new Set(allTunes.flatMap(t => t.tags || []))].sort();
            populateSelect('tag-filter', tags);

            // Genres
            const genres = [...new Set(allTunes.map(t => t.genre).filter(Boolean))].sort();
            populateSelect('genre-filter', genres);

            // Subgenres
            const subgenres = [...new Set(allTunes.map(t => t.subgenre).filter(Boolean))].sort();
            populateSelect('subgenre-filter', subgenres);

            // Moods
            const moods = [...new Set(allTunes.flatMap(t => t.moods || []))].sort();
            const moodsWithLabels = moods.map(m => ({
                value: m,
                label: m.charAt(0).toUpperCase() + m.slice(1)
            }));
            populateSelectWithLabels('mood-filter', moodsWithLabels);
        }

        function populateSelect(selectId, values) {
            const select = document.getElementById(selectId);
            values.forEach(value => {
                const opt = document.createElement('option');
                opt.value = value;
                opt.textContent = value;
                select.appendChild(opt);
            });
        }

        function populateSelectWithLabels(selectId, items) {
            const select = document.getElementById(selectId);
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.value;
                opt.textContent = item.label;
                select.appendChild(opt);
            });
        }

        // ============================================
        // Stats Update
        // ============================================
        function updateStats() {
            const total = allTunes.length;
            const categories = new Set(allTunes.map(t => t.category).filter(Boolean)).size;
            const composers = new Set(allTunes.map(t => t.composer).filter(Boolean)).size;
            const countries = new Set(allTunes.map(t => t.country).filter(Boolean)).size;
            const withSvg = allTunes.filter(t => t.svg).length;
            const withMidi = allTunes.filter(t => t.midi).length;

            document.getElementById('total-count').textContent = total;
            document.getElementById('category-count').textContent = categories;
            document.getElementById('composer-count').textContent = composers;
            document.getElementById('country-count').textContent = countries;
            document.getElementById('svg-count').textContent = withSvg;
            document.getElementById('midi-count').textContent = withMidi;
        }

        // ============================================
        // Filtering
        // ============================================
        function filterItems() {
            const searchInput = document.getElementById('search').value.toLowerCase();
            const categoryFilter = document.getElementById('category-filter').value;
            const countryFilter = document.getElementById('country-filter').value;
            const difficultyFilter = document.getElementById('difficulty-filter').value;
            const tagFilter = document.getElementById('tag-filter').value;
            const genreFilter = document.getElementById('genre-filter').value;
            const subgenreFilter = document.getElementById('subgenre-filter').value;
            const moodFilter = document.getElementById('mood-filter').value;
            const composerFilter = document.getElementById('composer-filter').value;

            // Save filter state to URL
            const params = new URLSearchParams(window.location.search);
            if (searchInput) params.set('search', searchInput);
            else params.delete('search');
            if (categoryFilter) params.set('category', categoryFilter);
            else params.delete('category');
            if (countryFilter) params.set('country', countryFilter);
            else params.delete('country');
            if (difficultyFilter) params.set('difficulty', difficultyFilter);
            else params.delete('difficulty');
            if (tagFilter) params.set('tag', tagFilter);
            else params.delete('tag');
            if (genreFilter) params.set('genre', genreFilter);
            else params.delete('genre');
            if (subgenreFilter) params.set('subgenre', subgenreFilter);
            else params.delete('subgenre');
            if (moodFilter) params.set('mood', moodFilter);
            else params.delete('mood');
            if (composerFilter) params.set('composer', composerFilter);
            else params.delete('composer');

            const newUrl = params.toString() ? `?${params.toString()}` : window.location.pathname;
            window.history.replaceState({}, '', newUrl);

            // Filter tunes
            filteredTunes = allTunes.filter(tune => {
                // Search
                if (searchInput) {
                    const searchFields = [
                        tune.title,
                        tune.composer,
                        tune.country,
                        tune.genre,
                        tune.subgenre,
                        tune.key,
                        ...(tune.tags || []),
                        ...(tune.moods || [])
                    ].join(' ').toLowerCase();
                    if (!searchFields.includes(searchInput)) return false;
                }

                // Category
                if (categoryFilter && tune.category !== categoryFilter) return false;

                // Country
                if (countryFilter && tune.country !== countryFilter) return false;

                // Difficulty (numeric comparison)
                if (difficultyFilter) {
                    const tuneDifficulty = getDifficultyLevel(tune.difficulty);
                    if (tuneDifficulty !== parseInt(difficultyFilter)) return false;
                }

                // Tag
                if (tagFilter && !(tune.tags || []).includes(tagFilter)) return false;

                // Genre
                if (genreFilter && tune.genre !== genreFilter) return false;

                // Subgenre
                if (subgenreFilter && tune.subgenre !== subgenreFilter) return false;

                // Mood
                if (moodFilter && !(tune.moods || []).includes(moodFilter)) return false;

                // Composer
                if (composerFilter && tune.composer !== composerFilter) return false;

                return true;
            });

            renderTunes();
            updateVisibleCount();
        }

        function getDifficultyLevel(difficulty) {
            if (!difficulty) return 3;
            const levels = {
                'Beginner': 1,
                'Easy': 2,
                'Intermediate': 3,
                'Advanced': 4,
                'Expert': 5
            };
            for (const [key, val] of Object.entries(levels)) {
                if (difficulty.includes(key)) return val;
            }
            return 3;
        }

        function updateVisibleCount() {
            const tuneCount = filteredTunes.length;
            document.getElementById('total-count').textContent = tuneCount;

            // Show versions summary when tunes have multiple variants
            const totalVariants = filteredTunes.reduce((sum, t) => sum + ((t.variants || []).length || 1), 0);
            const versionsSummary = document.getElementById('versions-summary');
            if (totalVariants > tuneCount) {
                versionsSummary.textContent = `(${totalVariants} versions)`;
                versionsSummary.style.display = 'block';
            } else {
                versionsSummary.style.display = 'none';
            }

            document.getElementById('no-results').style.display = tuneCount === 0 ? 'block' : 'none';
            if (currentView === 'table') {
                document.getElementById('table-container').style.display = tuneCount === 0 ? 'none' : 'block';
            } else {
                document.getElementById('cards-container').style.display = tuneCount === 0 ? 'none' : 'grid';
            }
        }

        // ============================================
        // Variant helpers
        // ============================================
        function getVariantLabel(variant) {
            if (!variant.arrangement && !variant.key_variant) return 'Standard';
            if (variant.arrangement && variant.key_variant) return `${variant.arrangement} (${variant.key_variant})`;
            if (variant.arrangement) return variant.arrangement;
            return `Key: ${variant.key_variant}`;
        }

        function getVariantSvgPath(tune, variant) {
            return `tunes/${tune.genre_folder}/${variant.stem}.svg`;
        }

        function getVariantMidiPath(tune, variant) {
            return `tunes/${tune.genre_folder}/${variant.stem}.midi`;
        }

        function buildVariantsHtml(tune) {
            const variants = tune.variants || [];
            if (variants.length <= 1) return '';
            const chips = variants.map(v => {
                const label = getVariantLabel(v);
                const svgPath = getVariantSvgPath(tune, v);
                const midiPath = getVariantMidiPath(tune, v);
                const title = variants.length > 1 ? `${tune.title} — ${label}` : tune.title;
                return `<button class="version-chip" onclick="event.stopPropagation(); openLightbox('${svgPath}', '${escapeHtml(title)}')">${escapeHtml(label)}</button>`;
            }).join('');
            return `<div class="card-versions"><span class="versions-label">${variants.length} versions:</span>${chips}</div>`;
        }

        // ============================================
        // Rendering
        // ============================================
        function renderTunes() {
            if (currentView === 'table') {
                renderTable();
            } else {
                renderCards();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            filteredTunes.forEach((tune, index) => {
                const row = document.createElement('tr');
                const tuneSlug = createSlug(tune.title);
                row.dataset.tuneSlug = tuneSlug;
                row.onclick = (e) => openTuneDetail(e, tune);

                const difficultyHtml = renderDifficultyStars(tune.difficulty);

                row.innerHTML = `
                    <td>
                        <strong>${escapeHtml(tune.title)}</strong>
                        ${tune.subgenre ? `<br><small style="color: #7f8c8d;">${escapeHtml(tune.subgenre)}</small>` : ''}
                        ${buildVariantsHtml(tune)}
                    </td>
                    <td>${escapeHtml(tune.composer || '—')}</td>
                    <td>${tune.country ? `${tune.country_flag || '🌍'} ${escapeHtml(tune.country)}` : '—'}</td>
                    <td>${tune.genre ? escapeHtml(tune.genre) : '—'}${tune.subgenre ? `<br><small style="color: #7f8c8d;">${escapeHtml(tune.subgenre)}</small>` : ''}</td>
                    <td>${escapeHtml(tune.key || '—')}</td>
                    <td>—</td>
                    <td>${difficultyHtml}</td>
                `;

                tbody.appendChild(row);
            });
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            filteredTunes.forEach((tune, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                const tuneSlug = createSlug(tune.title);
                card.dataset.tuneSlug = tuneSlug;
                card.onclick = (e) => openTuneDetail(e, tune);

                const difficultyHtml = renderDifficultyStars(tune.difficulty);

                // Thumbnail - wrap img in div for CSS selector compatibility
                let thumbnailHtml;
                if (tune.svg) {
                    thumbnailHtml = `<div class="card-thumbnail"><img src="${tune.svg}" alt="${escapeHtml(tune.title)}" loading="lazy" onclick="event.stopPropagation(); openLightbox('${tune.svg}', '${escapeHtml(tune.title)}')"></div>`;
                } else {
                    thumbnailHtml = '<div class="card-thumbnail no-preview">No preview available</div>';
                }

                // Actions
                let actionsHtml = '';
                if (tune.midi) {
                    actionsHtml += `<button class="btn-play" onclick="event.stopPropagation(); playMidi('${tune.midi}', '${escapeHtml(tune.title)}')">🎵 Play</button>`;
                }
                if (tune.svg) {
                    actionsHtml += `<button class="btn-view" onclick="event.stopPropagation(); openLightbox('${tune.svg}', '${escapeHtml(tune.title)}')">📄 View</button>`;
                }

                card.innerHTML = `
                    ${thumbnailHtml}
                    <div class="card-content">
                        <h3 class="card-title">${escapeHtml(tune.title)}</h3>
                        <div class="card-composer">${escapeHtml(tune.composer || 'Unknown')}</div>
                        <div class="card-country">${tune.country_flag || '🌍'} ${escapeHtml(tune.country || 'Unknown')}</div>
                        <div class="card-meta">
                            ${tune.category ? `<span class="card-tag">${escapeHtml(tune.category)}</span>` : ''}
                            ${tune.key ? `<span class="card-tag">🎹 ${escapeHtml(tune.key)}</span>` : ''}
                        </div>
                        <div class="card-difficulty">${difficultyHtml}</div>
                        ${buildVariantsHtml(tune)}
                        <div class="card-actions">${actionsHtml}</div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function renderDifficultyStars(difficulty) {
            const level = getDifficultyLevel(difficulty);
            let stars = '<div class="difficulty">';
            for (let i = 1; i <= 5; i++) {
                stars += `<span class="difficulty-star${i > level ? ' empty' : ''}">★</span>`;
            }
            stars += '</div>';
            return stars;
        }

        function createSlug(title) {
            return title.toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/(^-|-$)/g, '');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }

        // ============================================
        // Sorting
        // ============================================
        function sortTable(columnIndex) {
            const sortKeys = ['title', 'composer', 'country', 'genre', 'key', '', 'difficulty'];
            const key = sortKeys[columnIndex];

            if (key === '') return; // Can't sort by range

            if (currentSortColumn === columnIndex) {
                sortAscending = !sortAscending;
            } else {
                currentSortColumn = columnIndex;
                sortAscending = true;
            }

            filteredTunes.sort((a, b) => {
                let aVal, bVal;

                if (key === 'difficulty') {
                    aVal = getDifficultyLevel(a.difficulty);
                    bVal = getDifficultyLevel(b.difficulty);
                    return sortAscending ? aVal - bVal : bVal - aVal;
                }

                aVal = a[key] || '';
                bVal = b[key] || '';
                const result = aVal.localeCompare(bVal);
                return sortAscending ? result : -result;
            });

            renderTable();
        }

        // ============================================
        // View Switching
        // ============================================
        function switchView(view) {
            currentView = view;

            if (view === 'table') {
                document.getElementById('table-container').style.display = filteredTunes.length > 0 ? 'block' : 'none';
                document.getElementById('cards-container').style.display = 'none';
                document.getElementById('table-view').classList.add('active');
                document.getElementById('card-view').classList.remove('active');
            } else {
                document.getElementById('table-container').style.display = 'none';
                document.getElementById('cards-container').style.display = filteredTunes.length > 0 ? 'grid' : 'none';
                document.getElementById('table-view').classList.remove('active');
                document.getElementById('card-view').classList.add('active');
            }

            renderTunes();
        }

        // Auto-switch to card view on mobile
        function checkMobileView() {
            if (window.innerWidth <= 768) {
                switchView('cards');
            }
        }

        window.addEventListener('resize', checkMobileView);

        // ============================================
        // Quick Filters
        // ============================================
        function showTop10() {
            clearAllFilters(false);
            document.querySelectorAll('.quick-filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            // Show top tunes (Classical favorites or first 10)
            filteredTunes = allTunes.filter(t =>
                t.category === 'Classical' ||
                (t.tags && t.tags.includes('popular'))
            ).slice(0, 10);

            if (filteredTunes.length < 10) {
                filteredTunes = allTunes.slice(0, 10);
            }

            renderTunes();
            updateVisibleCount();
            updateURL('top10');
        }

        function showChristmas() {
            clearAllFilters(false);
            document.querySelectorAll('.quick-filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            filteredTunes = allTunes.filter(t =>
                t.category === 'Christmas' ||
                t.genre === 'Christmas' ||
                (t.tags && t.tags.includes('christmas'))
            );

            renderTunes();
            updateVisibleCount();
            updateURL('christmas');
        }

        function showWedding() {
            clearAllFilters(false);
            document.querySelectorAll('.quick-filter-btn').forEach(btn => btn.classList.remove('active'));
            if (event && event.target) event.target.classList.add('active');

            filteredTunes = allTunes.filter(t =>
                t.category === 'Wedding' ||
                (t.tags && t.tags.includes('wedding'))
            );

            renderTunes();
            updateVisibleCount();
            updateURL('wedding');
        }

        function clearAllFilters(updateUI = true) {
            document.getElementById('search').value = '';
            document.getElementById('category-filter').value = '';
            document.getElementById('country-filter').value = '';
            document.getElementById('difficulty-filter').value = '';
            document.getElementById('tag-filter').value = '';
            document.getElementById('genre-filter').value = '';
            document.getElementById('subgenre-filter').value = '';
            document.getElementById('mood-filter').value = '';
            document.getElementById('composer-filter').value = '';

            if (updateUI) {
                document.querySelectorAll('.quick-filter-btn').forEach(btn => btn.classList.remove('active'));
            }
        }

        function clearQuickFilters() {
            clearAllFilters(true);
            filteredTunes = [...allTunes];
            renderTunes();
            updateVisibleCount();

            // Clear URL parameters
            const url = new URL(window.location);
            url.search = '';
            window.history.pushState({}, '', url);
        }

        function updateURL(filterType) {
            try {
                const url = new URL(window.location);
                url.searchParams.set('filter', filterType);
                window.history.pushState({}, '', url);
            } catch(e) {
                console.error('Error updating URL:', e);
            }
        }

        // ============================================
        // URL State Restoration
        // ============================================
        function restoreFilterState() {
            const params = new URLSearchParams(window.location.search);

            if (params.has('filter')) {
                const filter = params.get('filter').toLowerCase();
                setTimeout(() => {
                    if (filter === 'christmas') showChristmas();
                    else if (filter === 'top10') showTop10();
                    else if (filter === 'wedding') showWedding();
                }, 100);
                return;
            }

            if (params.has('search')) document.getElementById('search').value = params.get('search');
            if (params.has('category')) document.getElementById('category-filter').value = params.get('category');
            if (params.has('country')) document.getElementById('country-filter').value = params.get('country');
            if (params.has('difficulty')) document.getElementById('difficulty-filter').value = params.get('difficulty');
            if (params.has('tag')) document.getElementById('tag-filter').value = params.get('tag');
            if (params.has('genre')) document.getElementById('genre-filter').value = params.get('genre');
            if (params.has('subgenre')) document.getElementById('subgenre-filter').value = params.get('subgenre');
            if (params.has('mood')) document.getElementById('mood-filter').value = params.get('mood');
            if (params.has('composer')) document.getElementById('composer-filter').value = params.get('composer');

            if (params.toString()) {
                filterItems();
            }
        }

        // ============================================
        // Navigation & Tune Detail View
        // ============================================
        function openTuneDetail(event, tune) {
            // Don't navigate if clicking on links, buttons, or actions
            if (event.target.closest('.card-actions') ||
                event.target.tagName === 'A' ||
                event.target.tagName === 'BUTTON' ||
                event.target.closest('a') ||
                event.target.closest('button')) {
                return;
            }

            const tuneSlug = createSlug(tune.title);

            // Update URL without page reload
            const url = new URL(window.location);
            url.searchParams.set('tune', tuneSlug);
            window.history.pushState({}, '', url);

            // Show tune detail view
            showTuneDetail(tune);
        }

        function showTuneDetail(tune) {
            // Hide the normal view
            document.getElementById('table-container').style.display = 'none';
            document.getElementById('cards-container').style.display = 'none';
            document.querySelector('.filters').style.display = 'none';
            document.querySelector('.stats').style.display = 'none';

            // Create detail view if it doesn't exist
            let detailView = document.getElementById('tune-detail-view');
            if (!detailView) {
                detailView = document.createElement('div');
                detailView.id = 'tune-detail-view';
                document.querySelector('.container').appendChild(detailView);
            }

            // Get navigation info
            const tuneSlug = createSlug(tune.title);
            const currentIndex = filteredTunes.findIndex(t => createSlug(t.title) === tuneSlug);
            const prevTune = currentIndex > 0 ? filteredTunes[currentIndex - 1] : null;
            const nextTune = currentIndex < filteredTunes.length - 1 ? filteredTunes[currentIndex + 1] : null;

            // Generate difficulty stars
            const level = getDifficultyLevel(tune.difficulty);
            const stars = '⭐'.repeat(level);

            // Build detail HTML
            let detailHTML = `
                <style>
                    #tune-detail-view {
                        padding: 1rem;
                        background: var(--bg-container);
                        color: var(--text-primary);
                    }
                    #tune-detail-view .back-link {
                        color: var(--ocean-mid);
                        text-decoration: none;
                        font-weight: 600;
                    }
                    #tune-detail-view .nav-btn {
                        padding: 8px 16px;
                        background: var(--ocean-mid);
                        color: white;
                        text-decoration: none;
                        border-radius: 6px;
                        font-weight: 600;
                        border: none;
                        cursor: pointer;
                    }
                    #tune-detail-view .nav-btn:hover {
                        background: var(--ocean-deep);
                    }
                    #tune-detail-view h1 {
                        color: var(--ocean-deep);
                        font-family: 'Crimson Pro', serif;
                        margin: 0;
                    }
                    #tune-detail-view .metadata-grid {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                        gap: 20px;
                        margin: 25px 0;
                        padding: 20px;
                        background: var(--bg-filter);
                        border-radius: 8px;
                    }
                    #tune-detail-view .preview-container {
                        margin: 30px 0;
                        background: white;
                        border-radius: 8px;
                        padding: 1rem;
                    }
                    [data-theme="dark"] #tune-detail-view .preview-container {
                        background: #1a1a2e;
                    }
                    #tune-detail-view .preview-img {
                        width: 100%;
                        max-width: 100%;
                        height: auto;
                        border-radius: 8px;
                        cursor: pointer;
                        background: white;
                    }
                    [data-theme="dark"] #tune-detail-view .preview-img {
                        filter: invert(1) hue-rotate(180deg);
                        background: transparent;
                    }
                    #tune-detail-view .action-btn {
                        padding: 12px 24px;
                        border: none;
                        border-radius: 6px;
                        font-weight: 600;
                        cursor: pointer;
                        display: inline-flex;
                        align-items: center;
                        gap: 8px;
                        text-decoration: none;
                        color: white;
                    }
                    #tune-detail-view .btn-play { background: #27ae60; }
                    #tune-detail-view .btn-view { background: var(--ocean-mid); }
                </style>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px;">
                    <a href="javascript:void(0)" onclick="hideTuneDetail()" class="back-link">← Back to Collection</a>
                    <div style="display: flex; align-items: center; gap: 15px;">
                        <span style="color: var(--text-secondary); font-size: 14px;">${currentIndex + 1} of ${filteredTunes.length}</span>
                        <div style="display: flex; gap: 8px;">
                            ${prevTune ? `<button class="nav-btn" onclick="showTuneDetail(filteredTunes[${currentIndex - 1}]); updateTuneUrl('${createSlug(prevTune.title)}')">← Previous</button>` : ''}
                            ${nextTune ? `<button class="nav-btn" onclick="showTuneDetail(filteredTunes[${currentIndex + 1}]); updateTuneUrl('${createSlug(nextTune.title)}')">Next →</button>` : ''}
                        </div>
                    </div>
                </div>

                <div style="display: flex; align-items: center; gap: 15px; margin: 20px 0; padding-bottom: 15px; border-bottom: 3px solid var(--ocean-mid);">
                    <h1>${escapeHtml(tune.title)}</h1>
                    ${tune.key ? `<span style="padding: 6px 12px; background: var(--bg-filter); border: 2px solid var(--ocean-mid); border-radius: 8px; font-weight: 700;">${escapeHtml(tune.key)}</span>` : ''}
                </div>

                <div class="metadata-grid">
                    <div><strong>Composer:</strong><br>${escapeHtml(tune.composer || '—')}</div>
                    <div><strong>Country:</strong><br>${tune.country_flag || '🌍'} ${escapeHtml(tune.country || '—')}</div>
                    <div><strong>Genre:</strong><br>${escapeHtml(tune.genre || '—')}${tune.subgenre ? `<br><small style="color: var(--text-secondary);">${escapeHtml(tune.subgenre)}</small>` : ''}</div>
                    <div><strong>Difficulty:</strong><br>${stars || '⭐⭐⭐'}</div>
                </div>
            `;

            // Add score preview
            if (tune.svg) {
                detailHTML += `
                    <div class="preview-container">
                        <img class="preview-img" src="${tune.svg}" alt="${escapeHtml(tune.title)}" onclick="openLightbox('${tune.svg}', '${escapeHtml(tune.title)}')">
                    </div>
                `;
            }

            // Add action buttons
            detailHTML += `<div style="display: flex; gap: 15px; margin: 30px 0; flex-wrap: wrap;">`;
            if (tune.midi) {
                detailHTML += `<button class="action-btn btn-play" onclick="playMidi('${tune.midi}', '${escapeHtml(tune.title)}')">🎵 Play MIDI</button>`;
            }
            if (tune.svg) {
                detailHTML += `<button class="action-btn btn-view" onclick="openLightbox('${tune.svg}', '${escapeHtml(tune.title)}')">📄 View Full Score</button>`;
            }
            detailHTML += `</div>`;

            // Add tags and moods if available
            if ((tune.tags && tune.tags.length) || (tune.moods && tune.moods.length)) {
                detailHTML += `<div style="margin-top: 20px; padding: 15px; background: var(--bg-filter); border-radius: 8px;">`;
                if (tune.tags && tune.tags.length) {
                    detailHTML += `<div style="margin-bottom: 10px;"><strong>Tags:</strong> ${tune.tags.map(t => `<span style="padding: 2px 8px; background: var(--ocean-bright); color: white; border-radius: 4px; margin: 2px; display: inline-block;">${escapeHtml(t)}</span>`).join(' ')}</div>`;
                }
                if (tune.moods && tune.moods.length) {
                    detailHTML += `<div><strong>Moods:</strong> ${tune.moods.map(m => `<span style="padding: 2px 8px; background: var(--coral); color: white; border-radius: 4px; margin: 2px; display: inline-block;">${escapeHtml(m)}</span>`).join(' ')}</div>`;
                }
                detailHTML += `</div>`;
            }

            // Keyboard shortcuts hint
            detailHTML += `
                <div style="margin-top: 40px; padding: 15px; background: var(--bg-filter); border-left: 4px solid var(--ocean-mid); border-radius: 4px; font-size: 13px;">
                    <strong>⌨️ Keyboard Shortcuts:</strong><br>
                    <span style="display: inline-block; margin-top: 8px;">
                        ${prevTune ? '<kbd style="padding: 2px 6px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 3px;">←</kbd> Previous tune &nbsp;&nbsp;' : ''}
                        ${nextTune ? '<kbd style="padding: 2px 6px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 3px;">→</kbd> Next tune &nbsp;&nbsp;' : ''}
                        <kbd style="padding: 2px 6px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 3px;">Esc</kbd> Back to collection
                    </span>
                </div>
            `;

            detailView.innerHTML = detailHTML;
            detailView.style.display = 'block';

            // Update page title
            document.title = tune.title + ' - Mouries\' Music';

            // Set up keyboard navigation
            setupDetailKeyboardNav(currentIndex);
        }

        function updateTuneUrl(tuneSlug) {
            const url = new URL(window.location);
            url.searchParams.set('tune', tuneSlug);
            window.history.pushState({}, '', url);
        }

        function hideTuneDetail() {
            const detailView = document.getElementById('tune-detail-view');
            if (detailView) {
                detailView.style.display = 'none';
            }

            // Show normal view
            if (currentView === 'table') {
                document.getElementById('table-container').style.display = 'block';
            } else {
                document.getElementById('cards-container').style.display = 'grid';
            }
            document.querySelector('.filters').style.display = 'flex';
            document.querySelector('.stats').style.display = 'flex';

            // Reset page title
            document.title = 'Mouries\' Music 🎵';

            // Update URL - remove tune parameter
            const url = new URL(window.location);
            url.searchParams.delete('tune');
            window.history.pushState({}, '', url);

            // Remove keyboard handler
            if (window.detailKeyboardHandler) {
                document.removeEventListener('keydown', window.detailKeyboardHandler);
            }
        }

        function setupDetailKeyboardNav(currentIndex) {
            // Remove any existing handler
            if (window.detailKeyboardHandler) {
                document.removeEventListener('keydown', window.detailKeyboardHandler);
            }

            window.detailKeyboardHandler = function(e) {
                // Ignore if typing in input
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

                if (e.key === 'ArrowLeft' && currentIndex > 0) {
                    e.preventDefault();
                    const prevTune = filteredTunes[currentIndex - 1];
                    showTuneDetail(prevTune);
                    updateTuneUrl(createSlug(prevTune.title));
                } else if (e.key === 'ArrowRight' && currentIndex < filteredTunes.length - 1) {
                    e.preventDefault();
                    const nextTune = filteredTunes[currentIndex + 1];
                    showTuneDetail(nextTune);
                    updateTuneUrl(createSlug(nextTune.title));
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    hideTuneDetail();
                }
            };

            document.addEventListener('keydown', window.detailKeyboardHandler);
        }

        // Handle URL tune parameter on page load
        function checkUrlForTune() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('tune')) {
                const tuneSlug = params.get('tune');
                const tune = allTunes.find(t => createSlug(t.title) === tuneSlug);
                if (tune) {
                    showTuneDetail(tune);
                }
            }
        }

        // ============================================
        // MIDI Player
        // ============================================
        let midiPlayer = {
            part: null,
            synth: null,
            isPlaying: false,
            currentFile: null,
            currentTitle: null,
            tempo: 1.0
        };

        async function playMidi(midiPath, title) {
            try {
                await Tone.start();

                if (midiPlayer.isPlaying) {
                    Tone.Transport.stop();
                    Tone.Transport.position = "0:0:0";
                    midiPlayer.isPlaying = false;
                }

                if (midiPlayer.currentFile !== midiPath) {
                    console.log('Loading MIDI:', title);
                    const midi = await Midi.fromUrl(midiPath);

                    if (!midiPlayer.synth) {
                        midiPlayer.synth = new Tone.PolySynth(Tone.Synth, {
                            volume: -8,
                            oscillator: { type: 'sine' },
                            envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
                        }).toDestination();
                    }

                    const notes = midi.tracks[0]?.notes || [];
                    if (notes.length === 0) {
                        alert('No notes found in MIDI file');
                        return;
                    }

                    if (midiPlayer.part) midiPlayer.part.dispose();

                    midiPlayer.part = new Tone.Part((time, note) => {
                        midiPlayer.synth.triggerAttackRelease(note.name, note.duration, time, note.velocity);
                    }, notes);

                    midiPlayer.part.loop = false;
                    midiPlayer.part.start(0);
                    midiPlayer.currentFile = midiPath;
                    midiPlayer.currentTitle = title;

                    console.log('MIDI loaded:', notes.length, 'notes');
                }

                Tone.Transport.bpm.value = 120 * midiPlayer.tempo;
                Tone.Transport.start();
                midiPlayer.isPlaying = true;
                console.log('Playing:', title);

                document.getElementById('midi-title').textContent = '🎵 ' + title;
                document.getElementById('midi-controls').classList.add('active');

            } catch (err) {
                console.error('MIDI playback error:', err);
                alert('Error playing MIDI: ' + err.message);
            }
        }

        function stopMidi() {
            if (midiPlayer.isPlaying) {
                Tone.Transport.stop();
                Tone.Transport.position = "0:0:0";
                midiPlayer.isPlaying = false;
            }
            closeMidiControls();
        }

        function closeMidiControls() {
            document.getElementById('midi-controls').classList.remove('active');
        }

        // ============================================
        // Lightbox
        // ============================================
        function openLightbox(imageSrc, title) {
            const lightbox = document.getElementById('lightbox-modal');
            const image = document.getElementById('lightbox-image');
            const titleEl = document.getElementById('lightbox-title');

            image.src = imageSrc;
            image.alt = title;
            titleEl.textContent = title;
            lightbox.classList.add('active');

            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            const lightbox = document.getElementById('lightbox-modal');
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Close lightbox when clicking outside the image
        document.getElementById('lightbox-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // ============================================
        // Keyboard Shortcuts
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const lightbox = document.getElementById('lightbox-modal');
                if (lightbox.classList.contains('active')) {
                    closeLightbox();
                }
                if (midiPlayer.isPlaying) {
                    stopMidi();
                }
            }
        });

        // ============================================
        // Service Worker (PWA)
        // ============================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered:', registration.scope);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
