<g transform="translate(11.6906, 41.8976)">
<text font-family="Optima" font-size="2.2000" text-anchor="start" fill="currentColor">
<tspan>Suggested rotation: Fugues for polyphony, Sarabandes for tone and phrasing, </tspan>
